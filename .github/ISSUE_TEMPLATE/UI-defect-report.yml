name: UI Defect Report
description: Log UI defects with description and a structured table
title: "[MODULE] UI Defect (#PARENT) - "
labels: ["bug", "ui"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear summary of the UI issues
      placeholder: Describe the overall UI problem(s)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## UI Table Template (Copy & Paste Below)

        Use this HTML table to document multiple UI issues:

        ```html
        <table border="1">
          <tr>
            <th>Description</th>
            <th>Implemented</th>
            <th>Figma Design</th>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </table>
        ```

        Copy this and paste it into the field below, then fill it.

  - type: textarea
    id: ui-table
    attributes:
      label: UI Issues Table
      description: Paste the HTML table above and fill in the UI defects
      placeholder: Paste and complete the table here
    validations:
      required: true
